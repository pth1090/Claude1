services:
  hitec-knowledge-db:
    build: .
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_PATH=/app/data/papers.db
    volumes:
      - papers_data:/app/data
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.haibay.rule=Host(`haibay.srv1553019.hstgr.cloud`)"
      - "traefik.http.routers.haibay.entrypoints=web"
      - "traefik.http.services.haibay.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  papers_data:
